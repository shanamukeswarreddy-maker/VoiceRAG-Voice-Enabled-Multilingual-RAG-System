<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndicVoice — Voice-Enabled RAG</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app">
        <!-- Full-screen background video -->
        <video class="bg-video" autoplay muted loop playsinline>
            <source
                src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4"
                type="video/mp4"
            />
        </video>
        <div class="video-overlay"></div>

        <!-- Header -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo-container">
                    <img src="assets/logo.webp" alt="IndicVoice Logo" class="logo-img" />
                </div>
            </div>
            
            <div class="topbar-center">
                <h1 class="brand-title">INDICVOICE</h1>
                <span class="brand-subtitle">VOICE • RAG • AI</span>
            </div>

            <div class="topbar-right">
                <div class="online-pill">
                    <span class="online-dot">●</span>
                    <span class="online-text">ONLINE</span>
                </div>
            </div>
        </header>

        <!-- Main Assistant Composition -->
        <main class="assistant">
            <!-- Voice Hero Section -->
            <section class="voice-section">
                <div class="mic-wrapper">
                    <div class="voice-ring ring-1"></div>
                    <div class="voice-ring ring-2"></div>
                    <div class="voice-ring ring-3"></div>
                    <button class="mic-hero-btn" id="mic-hero-btn" aria-label="Start voice input" title="Tap to speak">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
                <div class="voice-action-title" id="voice-action-title">TAP TO SPEAK</div>
                <div class="voice-status-label" id="voice-status-label" aria-live="polite">READY TO LISTEN</div>
            </section>

            <!-- Conversation Region -->
            <section class="conversation" id="conversation-area" aria-label="Conversation History">
                <!-- Turns populated dynamically by main.js -->
            </section>

            <!-- Divider -->
            <div class="or-divider">
                <span class="divider-line"></span>
                <span class="divider-text">OR TYPE YOUR QUESTION</span>
                <span class="divider-line"></span>
            </div>

            <!-- Text Composer -->
            <section class="composer">
                <div class="composer-inner">
                    <textarea
                        class="composer-input"
                        id="composer-input"
                        placeholder="Ask anything in any language…"
                        rows="1"
                        aria-label="Ask IndicVoice"
                    ></textarea>
                    <div class="composer-actions">
                        <button class="composer-btn send-btn" id="send-btn" aria-label="Send message" title="Send message">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer / Status Bar -->
        <footer class="status-bar">
            <span>15 LANGUAGES</span>
            <span class="bullet">•</span>
            <span>HYBRID RAG</span>
            <span class="bullet">•</span>
            <span>GROQ AI</span>
            <span class="bullet">•</span>
            <span>VOICE ENABLED</span>
        </footer>
    </div>

    <!-- Application Script -->
    <script src="main.js"></script>
</body>
</html>
