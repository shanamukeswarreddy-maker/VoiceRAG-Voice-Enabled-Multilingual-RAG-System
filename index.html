<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndicVoice — Voice-Enabled RAG</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app">
        <!-- Background Video Layer (4 Stacked Videos - Sequential Loop) -->
        <div class="bg-video-container">
            <video class="bg-video opacity-100 active" id="bg-video-0" autoplay muted playsinline>
                <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_081127_0992a171-d3c6-4978-8213-0ec5df8b6d63.mp4" type="video/mp4" />
            </video>
            <video class="bg-video opacity-0" id="bg-video-1" autoplay muted playsinline>
                <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_092026_dd05b805-ea0f-40b2-8c52-332b88502592.mp4" type="video/mp4" />
            </video>
            <video class="bg-video opacity-0" id="bg-video-2" autoplay muted playsinline>
                <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_081042_df7202bf-bd80-4b2b-bbc6-1f09ba2870e9.mp4" type="video/mp4" />
            </video>
            <video class="bg-video opacity-0" id="bg-video-3" autoplay muted playsinline>
                <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_080959_4cac5234-3573-464e-a5b7-76b94b8a7d61.mp4" type="video/mp4" />
            </video>
        </div>
        <!-- Transparent PNG Overlay (z-index 1) -->
        <div class="png-overlay">
            <img
                src="https://soft-zoom-63098134.figma.site/_assets/v11/0b4a435b2df2747593c43d7a1c9b4578f7d8d90c.png"
                alt=""
                class="overlay-img"
            />
        </div>
        <div class="video-overlay"></div>

        <!-- Side Navigation Drawer (Sandwich Bar) -->
        <div class="drawer-overlay" id="drawer-overlay"></div>
        <aside class="sidenav-drawer" id="sidenav-drawer" aria-label="Side Navigation">
            <div class="drawer-header">
                <div class="drawer-brand">
                    <img src="assets/logo.webp" alt="Logo" class="drawer-logo" />
                    <div>
                        <div class="drawer-title">INDICVOICE</div>
                        <div class="drawer-sub">VOICE • RAG • AI</div>
                    </div>
                </div>
                <button class="drawer-close-btn" id="drawer-close-btn" aria-label="Close Menu">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="drawer-nav">
                <a href="#" class="drawer-link active">
                    <i class="fa-solid fa-microphone"></i>
                    <span>Voice Assistant</span>
                </a>
                <a href="#" class="drawer-link" onclick="event.preventDefault(); alert('15 Indic Languages Supported: Hindi, Tamil, Telugu, Bengali, Marathi, Gujarati, Kannada, Malayalam, Punjabi, Odia, Assamese, etc.');">
                    <i class="fa-solid fa-globe"></i>
                    <span>Multilingual Settings</span>
                </a>
                <a href="#" class="drawer-link" onclick="event.preventDefault(); alert('Hybrid RAG System: FAISS Vector Index + BM25 Lexical Search + RRF Reciprocal Rank Fusion + Groq LLM');">
                    <i class="fa-solid fa-bolt"></i>
                    <span>RAG & Model Info</span>
                </a>
                <a href="#" class="drawer-link" onclick="event.preventDefault(); alert('Telemetry Active: Pipeline latencies, STT timings, and confidence scores live logging.');">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Telemetry Logs</span>
                </a>
                <a href="#" class="drawer-link" onclick="event.preventDefault(); fetch('/api/health').then(r=>r.json()).then(d=>alert('System Diagnostics:\n' + JSON.stringify(d, null, 2)));">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>System Diagnostics</span>
                </a>
            </nav>

            <div class="drawer-footer">
                <div class="drawer-footer-pill">
                    <span class="online-dot">●</span> SYSTEM READY
                </div>
                <div class="drawer-footer-text">IndicVoice v1.0 • Multilingual RAG</div>
            </div>
        </aside>

        <!-- Header -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="logo-container drawer-toggle" id="drawer-toggle" aria-label="Toggle Navigation Menu" title="Open Menu">
                    <img src="assets/logo.webp" alt="IndicVoice Logo" class="logo-img" />
                    <span class="hamburger-badge"><i class="fa-solid fa-bars"></i></span>
                </button>
            </div>
            
            <div class="topbar-center">
                <h1 class="brand-title">INDICVOICE</h1>
                <span class="brand-subtitle">VOICE • RAG • AI</span>
            </div>

            <div class="topbar-right" style="width: 48px;"></div>
        </header>

        <!-- Main Assistant Composition -->
        <main class="assistant">
            <!-- Voice Hero Section -->
            <section class="voice-section">
                <div class="mic-wrapper">
                    <div class="voice-ring ring-1"></div>
                    <div class="voice-ring ring-2"></div>
                    <div class="voice-ring ring-3"></div>
                    <button class="mic-hero-btn" id="mic-hero-btn" aria-label="Start voice input" title="Tap to speak">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
                <div class="voice-action-title" id="voice-action-title">TAP TO SPEAK</div>
                <div class="voice-status-label" id="voice-status-label" aria-live="polite">READY TO LISTEN</div>
            </section>

            <!-- Divider -->
            <div class="or-divider">
                <span class="divider-line"></span>
                <span class="divider-text">OR TYPE YOUR QUESTION</span>
                <span class="divider-line"></span>
            </div>

            <!-- Text Composer -->
            <section class="composer">
                <div class="composer-inner">
                    <textarea
                        class="composer-input"
                        id="composer-input"
                        placeholder="Ask anything in any language…"
                        rows="1"
                        aria-label="Ask IndicVoice"
                    ></textarea>
                    <div class="composer-actions">
                        <button class="composer-btn send-btn" id="send-btn" aria-label="Send message" title="Send message">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Conversation Region (Answer Panel Below Chat Box) -->
            <section class="conversation" id="conversation-area" aria-label="Conversation History">
                <!-- Turns populated dynamically by main.js -->
            </section>
        </main>

        <!-- Footer / Status Bar -->
        <footer class="status-bar">
            <span>15 LANGUAGES</span>
            <span class="bullet">•</span>
            <span>HYBRID RAG</span>
            <span class="bullet">•</span>
            <span>GROQ AI</span>
            <span class="bullet">•</span>
            <span>VOICE ENABLED</span>
        </footer>
    </div>

    <!-- Application Script -->
    <script src="main.js"></script>
</body>
</html>
